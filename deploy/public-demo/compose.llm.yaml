# Optional local questionnaire model. Not used by the existing CPU vision QA stack.
services:
  llm:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: "-1"
    volumes: ["local_llm:/root/.ollama"]
    networks: [service]
    gpus: all
    mem_limit: 4g
    read_only: true
    tmpfs: ["/tmp:size=268435456,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen3:4b"]
      start_period: 30s
      interval: 15s
      timeout: 10s
      retries: 12
    logging:
      driver: local
      options: {max-size: "5m", max-file: "2"}
  llm-pull:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    profiles: [setup]
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes: ["local_llm:/root/.ollama"]
    networks: [outbound]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        ollama serve >/tmp/ollama-setup.log 2>&1 &
        server_pid=$$!
        trap 'kill $$server_pid 2>/dev/null || true' EXIT
        i=0
        until ollama list >/dev/null 2>&1; do
          i=$$((i+1)); [ $$i -lt 60 ] || exit 1; sleep 1
        done
        if ollama show qwen3:4b >/dev/null 2>&1; then
          echo 'Using cached qwen3:4b; startup verification checks its digest.'
        else
          ollama pull qwen3:4b
        fi
    mem_limit: 1g
  ai:
    environment:
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://llm:11434
      LLM_MODEL: qwen3:4b
    depends_on:
      llm: {condition: service_healthy}
volumes:
  local_llm:
