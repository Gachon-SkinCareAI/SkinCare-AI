services:
  postgres:
    image: postgres:16
    container_name: caremap-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: caremap
      POSTGRES_USER: caremap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - caremap-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caremap -d caremap"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: caremap-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - caremap-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  caremap-pg:
  caremap-redis:
