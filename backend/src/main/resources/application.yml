jwt:
  secret: ${JWT_SECRET}

server:
  port: 9800

skincare:
  medical:
    service-key: ${PUBLIC_MEDICAL_SERVICE_KEY:}
  consent:
    builtin-policies: ${SKINCARE_BUILTIN_POLICIES:false}
    terms-policy-url: ${TERMS_POLICY_URL:}
    privacy-policy-url: ${PRIVACY_POLICY_URL:}
    training-policy-url: ${TRAINING_POLICY_URL:}
  review:
    clinical-reviewers: ${SKINCARE_CLINICAL_REVIEWERS:}
  bootstrap:
    admin-id: ${SKINCARE_BOOTSTRAP_ADMIN_ID:}
    admin-password: ${SKINCARE_BOOTSTRAP_ADMIN_PASSWORD:}
  ai:
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    token: ${AI_SERVICE_TOKEN:}
    read-timeout-seconds: 30

spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  datasource:
    driver-class-name: ${DB_CLASS_NAME}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
#      ddl-auto: create
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  cache:
    disabled: true # 캐시 사용 여부
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    enabled: true # Swagger UI 접근 경로 => http://localhost:9800/swagger-ui/index.html
    path: /swagger.html # Swagger UI 추가 접근 경로 => http://localhost:8080/swagger.html
    tags-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬
    operations-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬

# Provider secrets stay on the backend. Empty pairs disable that provider.
social:
  public-base-url: ${SOCIAL_PUBLIC_BASE_URL:http://127.0.0.1:9800}
  redirect-uris: ${SOCIAL_REDIRECT_URIS:http://127.0.0.1:8081/,http://localhost:8081/,skincareai://oauth/callback}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_SECRET:}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
