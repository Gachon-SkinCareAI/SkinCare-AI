plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'backend'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
    // 1. 보안 관련 설정
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    testImplementation 'org.springframework.security:spring-security-test'

    // Spring Security OAuth2 Client
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Spring Boot Mail Starter
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 2. 개발 도구 및 JPA
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // 3. Spring Integration 모듈들
    implementation 'org.springframework.boot:spring-boot-starter-integration'
    testImplementation 'org.springframework.integration:spring-integration-test'
    implementation 'org.springframework.integration:spring-integration-http'
    implementation 'org.springframework.integration:spring-integration-jpa'

    // 4. Web & Swagger
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 5. Thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // 6. Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // 7. JWT Token
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Source: https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-starter-webmvc-ui
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
// -PprebuiltAdminWeb: package an existing admin-web/dist instead of running npm
// (used where the JDK build container has no Node.js, e.g. deploy/oracle/update_server.sh).
def prebuiltAdminWeb = project.hasProperty('prebuiltAdminWeb')

tasks.register('installAdminWeb', Exec) {
    workingDir '../admin-web'
    commandLine(isWindows ? ['cmd', '/c', 'npm', 'ci', '--no-audit', '--no-fund'] : ['npm', 'ci', '--no-audit', '--no-fund'])
    inputs.file('../admin-web/package-lock.json')
    outputs.dir('../admin-web/node_modules')
}

tasks.register('buildAdminWeb', Exec) {
    dependsOn 'installAdminWeb'
    workingDir '../admin-web'
    commandLine(isWindows ? ['cmd', '/c', 'npm', 'run', 'build'] : ['npm', 'run', 'build'])
    inputs.files(fileTree('../admin-web/src'), fileTree('../admin-web/public'), '../admin-web/index.html', '../admin-web/package-lock.json', '../admin-web/vite.config.ts', '../admin-web/tsconfig.json')
    outputs.dir('../admin-web/dist')
}

tasks.register('verifyAdminWebDist') {
    doLast {
        if (!file('../admin-web/dist/index.html').exists())
            throw new GradleException('admin-web/dist is missing: run "npm ci && npm run build" in admin-web, or build without -PprebuiltAdminWeb')
    }
}

tasks.named('processResources') {
    dependsOn(prebuiltAdminWeb ? 'verifyAdminWebDist' : 'buildAdminWeb')
    from('../ai/guide') { include 'cards.yaml'; into 'review-catalog' }
    from('../ai/qa') { include 'bank.yaml','rules.yaml'; into 'review-catalog' }
    // /admin/      React console (dashboard, diagnoses, AI monitoring, facilities, users, inquiries)
    from('../admin-web/dist') {
        into 'static/admin'
    }
    // /admin/ops/  API-backed operations console, kept for the screens the React console
    // does not have yet: content reviews, audit history and administrator password change.
    from('../admin-web/operational') {
        include 'index.html', 'app.js', 'style.css', 'src/**/*.js'
        into 'static/admin/ops'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}
