# PR과 develop/main push마다 테스트 실행
# develop에 병합하면 서버에 자동 반영되므로, 빨간 X가 뜬 PR은 병합하지 말 것
name: tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # processResources builds admin-web with npm
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: test
        working-directory: backend
        run: sh ./gradlew --no-daemon test
      - name: test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # tests use only node built-ins, no npm install needed
      - name: test
        working-directory: mobile
        run: npm test

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ai/requirements.txt pytest httpx
      - name: test
        working-directory: ai
        run: python -m pytest -q tests

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "qrcode[pil]" opencv-python-headless
      - name: shell syntax
        run: for f in deploy/oracle/*.sh; do bash -n "$f"; done
      - name: deploy/mysql
        working-directory: deploy/mysql
        run: python -m unittest discover -p "test_*.py"
      - name: deploy/public-demo
        working-directory: deploy/public-demo
        run: python -m unittest discover -p "test_*.py"
